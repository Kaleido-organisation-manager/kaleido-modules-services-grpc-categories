syntax = "proto3";

package Kaleido.Grpc.Categories;

import "google/protobuf/timestamp.proto";
  
message Category {
    string name = 1;
}

message CategoryRequest {
    string key = 1;
}

message CategoryActionRequest {
    string key = 1;
    Category category = 2;
}

message EmptyRequest {}

message CategoryRevision {
    string key = 1;
    int32 revision = 2;
    string action = 3;
    google.protobuf.Timestamp createdAt = 4;
    string status = 5;
}

message CategoryResponse {
    string key = 1;
    Category category = 2;
    CategoryRevision revision = 3;
}

message CategoryListResponse {
    repeated CategoryResponse categories = 1;
}

message GetAllCategoriesFilteredRequest {
    string name = 1;
}

message GetCategoryRevisionRequest {
  string key = 1;
  google.protobuf.Timestamp createdAt = 2;
}

